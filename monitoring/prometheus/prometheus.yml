global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: flower
    metrics_path: /metrics
    static_configs:
      - targets: ["flower:5555"]

  - job_name: mysql
    static_configs:
      - targets: ["mysql-exporter:9104"]

  - job_name: redis-ws
    static_configs:
      - targets: ["redis-exporter-ws:9121"]

  - job_name: redis-cache
    static_configs:
      - targets: ["redis-exporter-cache:9121"]

  - job_name: elasticsearch
    static_configs:
      - targets: ["elasticsearch-exporter:9114"]
