[project]
name = "campus-community-backend"
version = "0.1.0"
description = "校园实时互动社区后端服务"
requires-python = "==3.12.*"
dependencies = [
    "django>=6.0,<6.1",
    "djangorestframework>=3.16,<3.17",
    "djangorestframework-simplejwt>=5.5,<5.6",
    "django-cors-headers>=4.9,<4.10",
    "channels>=4.3,<4.4",
    "channels-redis>=4.2,<4.3",
    "websockets>=14.0,<16.0",
    "python-dotenv>=1.0,<2",
    "pymysql>=1.2,<1.3",
    "pillow>=12.0,<13",
    "aliyun-python-sdk-core>=2.16,<2.17",
    "uvicorn>=0.42,<0.43",
    "celery>=5.5,<5.6",
    "elasticsearch-dsl>=8.0,<9.0",
    "django-redis>=5.4,<5.5",
    "bleach>=6.0,<7",
    "drf-spectacular>=0.28,<0.30",
    "django-storages[s3]>=1.14,<2",
]

[project.optional-dependencies]
dev = [
    "faker>=25.0,<26",
]
prod = [
    "gunicorn>=25.0,<26",
    "daphne>=4.2,<4.3",
    "uvicorn[standard]>=0.42,<0.43",
    "flower>=2.0,<3",
]

[dependency-groups]
dev = [
    "daphne>=4.2.2",
    "pip-audit>=2.10.1",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    "**/migrations/**",
    "**/__pycache__/**",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Django 初始化 / sys.path 注入后再导入，属于有意为之
"config/__init__.py" = ["E402"]
"config/asgi.py" = ["E402"]
"config/asgi_ws.py" = ["E402"]
"schools/views.py" = ["E402"]
"scripts/**/*.py" = ["E402"]
"tests/test_points_notifications.py" = ["E402"]

